<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Rideau — Amenity Inspections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0b1826;
    --navy:#132a3e;
    --navy-light:#1c3a53;
    --navy-card:#17324a;
    --gold:#c9a04a;
    --gold-bright:#e0bc6b;
    --text:#eae6dc;
    --text-muted:#8fa1b3;
    --ok:#5c9c7c;
    --ok-bg:rgba(92,156,124,0.16);
    --warn:#c96a52;
    --warn-bg:rgba(201,106,82,0.16);
    --border:rgba(201,160,74,0.22);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--navy-deep);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(201,160,74,0.06), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(201,160,74,0.04), transparent 40%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header.top{text-align:center;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border);}
  .eyebrow{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;font-weight:600;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:26px;margin:0;letter-spacing:0.01em;}
  .sub{color:var(--text-muted);font-size:13px;margin-top:6px;}

  .room-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:480px){.room-grid{grid-template-columns:1fr;}}
  .room-card{background:var(--navy-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 16px;cursor:pointer;transition:border-color .15s, transform .15s;text-align:left;}
  .room-card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .room-card .rc-label{font-family:'Fraunces',serif;font-size:17px;font-weight:600;}
  .room-card .rc-meta{color:var(--text-muted);font-size:12px;margin-top:4px;}

  .choice-row{display:flex;gap:14px;flex-direction:column;}
  .choice-card{background:var(--navy-card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
  .choice-card:hover{border-color:var(--gold);}
  .choice-card .cc-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600;}
  .choice-card .cc-desc{color:var(--text-muted);font-size:12.5px;margin-top:3px;}
  .choice-card .cc-arrow{color:var(--gold);font-size:20px;}

  .backbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .backbtn{background:none;border:1px solid var(--border);color:var(--text-muted);padding:6px 12px;border-radius:6px;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;}
  .backbtn:hover{border-color:var(--gold);color:var(--gold);}
  .crumb{color:var(--text-muted);font-size:12.5px;}
  .crumb b{color:var(--gold-bright);font-weight:600;}

  /* progress */
  .progress-wrap{margin-bottom:20px;}
  .progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .progress-label span.count{color:var(--gold-bright);font-weight:600;}
  .progress-track{height:6px;background:var(--navy);border-radius:4px;overflow:hidden;border:1px solid var(--border);}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));border-radius:4px;transition:width .25s ease;width:0%;}

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
  @media (max-width:480px){.field-grid{grid-template-columns:1fr;}}
  .field label{display:block;font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
  .field input, .field textarea{width:100%;background:var(--navy);border:1px solid var(--border);color:var(--text);padding:10px 11px;border-radius:7px;font-size:14px;font-family:'Inter',sans-serif;}
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--gold);}
  .unit-suggestions{position:absolute;top:100%;left:0;right:0;background:var(--navy);
    border:1px solid var(--gold);border-radius:7px;margin-top:4px;max-height:190px;
    overflow-y:auto;z-index:20;display:none;box-shadow:0 8px 20px rgba(0,0,0,0.35);}
  .unit-suggestions.show{display:block;}
  .us-item{padding:9px 13px;font-size:13.5px;cursor:pointer;border-bottom:1px solid rgba(201,160,74,0.08);}
  .us-item:last-child{border-bottom:none;}
  .us-item:hover, .us-item.highlight{background:var(--navy-light);color:var(--gold-bright);}

  /* group cards */
  .group{background:var(--navy-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;}
  .group-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .group-icon{font-size:17px;line-height:1;}
  .group-title{font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--gold-bright);flex:1;}
  .group-count{font-size:10.5px;color:var(--text-muted);background:var(--navy);border:1px solid var(--border);padding:2px 8px;border-radius:10px;}

  .item{padding:12px 16px;border-bottom:1px solid rgba(201,160,74,0.09);}
  .item:last-child{border-bottom:none;}
  .item-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .item-name{font-size:13.5px;line-height:1.35;flex:1;min-width:140px;}
  .item-controls{display:flex;gap:8px;align-items:center;flex-shrink:0;}

  .pill{padding:8px 16px;border-radius:20px;border:1.5px solid rgba(201,160,74,0.45);background:var(--navy-light);
    font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;transition:all .12s;
    font-family:'Inter',sans-serif;white-space:nowrap;}
  .pill:hover{border-color:var(--gold-bright);background:var(--navy-card);}
  .pill.ok.active{background:var(--ok);border-color:var(--ok);color:#0b1826;font-weight:700;
    box-shadow:0 0 0 3px var(--ok-bg);}
  .pill.issue.active{background:var(--warn);border-color:var(--warn);color:#0b1826;font-weight:700;
    box-shadow:0 0 0 3px var(--warn-bg);}
  .pill.select.active{background:var(--gold);border-color:var(--gold);color:#0b1826;font-weight:700;
    box-shadow:0 0 0 3px rgba(201,160,74,0.25);}

  .qty-badge{background:var(--navy);border:1px solid var(--border);border-radius:5px;padding:3px 8px;font-size:11px;color:var(--text-muted);margin-right:2px;}
  .id-input{width:88px;background:var(--navy);border:1px solid var(--border);color:var(--text);padding:6px 9px;border-radius:6px;font-size:12px;}

  .issue-note{margin-top:9px;display:none;}
  .issue-note.show{display:block;}
  .issue-note input{width:100%;background:var(--navy-deep);border:1px solid var(--warn);color:var(--text);padding:8px 10px;border-radius:6px;font-size:12.5px;}
  .issue-note input::placeholder{color:var(--text-muted);}

  /* flagged summary */
  .flagged-panel{background:var(--warn-bg);border:1px solid var(--warn);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;display:none;}
  .flagged-panel.show{display:block;}
  .flagged-title{font-family:'Fraunces',serif;font-size:14px;font-weight:600;color:var(--warn);margin-bottom:8px;display:flex;align-items:center;gap:7px;}
  .flagged-list{list-style:none;margin:0;padding:0;font-size:12.5px;}
  .flagged-list li{padding:5px 0;border-bottom:1px solid rgba(201,106,82,0.2);color:var(--text);}
  .flagged-list li:last-child{border-bottom:none;}
  .flagged-list li .fl-note{color:var(--text-muted);font-style:italic;}

  .photo-section{background:var(--navy-card);border:1px dashed var(--border);border-radius:var(--radius);padding:22px;text-align:center;margin-bottom:16px;}
  .photo-section .ph-icon{font-size:22px;margin-bottom:6px;}
  .photo-section .ph-text{color:var(--text-muted);font-size:12.5px;}
  .photo-upload-btn{margin-top:12px;background:transparent;border:1px solid var(--gold);color:var(--gold-bright);padding:8px 18px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;}

  .submit-btn{width:100%;background:linear-gradient(135deg,var(--gold),#a67f34);color:var(--navy-deep);border:none;padding:15px;border-radius:9px;font-size:14.5px;font-weight:700;cursor:pointer;letter-spacing:.02em;font-family:'Inter',sans-serif;margin-top:6px;}
  .submit-btn:hover{filter:brightness(1.08);}
  .submit-btn:disabled{opacity:0.6;cursor:default;}
  .watermark{text-align:center;color:var(--text-muted);font-size:10px;margin-top:26px;letter-spacing:.05em;text-transform:uppercase;opacity:0.6;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-card);border:1px solid var(--gold);color:var(--gold-bright);padding:12px 22px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;bottom:32px;}

  /* ---- SINGLE PERSISTENT LOGO: floats from center-screen to a docked
     top position and stays there. Page content is hidden until it lands. ---- */
  #siteLogo{position:fixed;z-index:150;top:50%;left:50%;
    transform:translate(-50%,-50%);width:min(46vw,170px);
    opacity:0;filter:blur(10px);
    transition:top 1.2s cubic-bezier(0.16,1,0.3,1), transform 1.2s cubic-bezier(0.16,1,0.3,1),
      width 1.2s cubic-bezier(0.16,1,0.3,1), opacity .9s ease, filter .9s ease;}
  #siteLogo.visible{opacity:1;filter:drop-shadow(0 0 30px rgba(201,160,74,0.4)) drop-shadow(0 0 60px rgba(201,160,74,0.15));}
  #siteLogo.docked{top:22px;transform:translate(-50%,0);width:70px;
    filter:drop-shadow(0 4px 14px rgba(201,160,74,0.3));}

  #gateBackdrop{position:fixed;inset:0;z-index:120;background:var(--navy-deep);
    background-image:radial-gradient(circle at 50% 30%, rgba(201,160,74,0.10), transparent 55%);
    transition:opacity .3s ease;}
  .gate-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 30%,rgba(0,0,0,0.5) 100%);}

  #pageWrap{opacity:0;transform:translateY(14px);transition:opacity .3s ease, transform .3s ease;
    padding-top:132px;}
  #pageWrap.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<img id="siteLogo" src="logo.png" alt="The Rideau">
<div id="gateBackdrop"><div class="gate-vignette"></div></div>
<div class="wrap" id="pageWrap">
  <header class="top">
    <div class="eyebrow">The Rideau &nbsp;·&nbsp; 1035 Bank Street</div>
    <h1>Amenity Inspections</h1>
    <div class="sub">Select a room to begin</div>
    <div style="margin-top:10px;"><a href="reports.html" style="color:var(--gold);font-size:11.5px;text-decoration:none;border:1px solid var(--border);padding:5px 14px;border-radius:14px;">View Reports &rarr;</a></div>
  </header>
  <div id="app"></div>
  <div class="watermark">Designed by Shrutik</div>
</div>
<div class="toast" id="toast"></div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz-69e-XALVtmU1bJ2WpPpUbs39KVniUmsxNzDkxlH8LxErxg7qEWlytviprtTAJvL6xQ/exec";

// =========================================================
// CONFIG
// Each item has its own "kind" so the control it gets actually
// matches what needs recording — a task item never gets a stock
// checkbox, a supply item never gets a Locked toggle, etc.
//
// kind: "task"      -> single "Done" pill
//       "condition" -> "Clean"/okLabel + "Issue" pill pair, with inline note when flagged
//       "security"  -> "Locked"/okLabel + "Issue" pill pair, with inline note when flagged
//       "supply"    -> single "Restocked" pill, reference qty shown alongside
//       "collect"   -> Pre: pick a fob number (if applicable) + "Provided" pill
//                      Post: "Returned" pill only. Never shows both in the same visit.
// =========================================================
const ROOMS = {
  canal_lounge: {
    label: "Canal Lounge & Patio",
    meta: "Tables, patio, BBQ, key",
    groups: [
      { title:"Collect & Return", icon:"🔑", kind:"collect",
        items:[{name:"Physical Key"}] },
      { title:"Furniture & Fixtures", icon:"🪑", kind:"condition",
        items:["Tables / Chairs","Doors / Flooring","Lights / Walls"] },
      { title:"Appliances", icon:"🔌", kind:"condition",
        items:[{name:"Dishwasher / Fridge", okLabel:"Clean & Empty"},"Range / Microwave / Wine Cooler","TV / Remote / Cable Box"] },
      { title:"Outdoor & BBQ", icon:"🔥", kind:"condition", okLabel:"Put Away",
        items:["BBQs / Utensils","Patio Furniture / Cushions"] },
      { title:"Cleaning Supplies", icon:"🧴", kind:"supply",
        items:[{name:"Paper Towel",qty:2},{name:"Cloth",qty:1},{name:"Multi-Purpose Cleaner",qty:1},{name:"Magic Erasers",qty:2}] }
    ]
  },
  guest_suite: {
    label: "Guest Suite",
    meta: "Bedroom, bathroom, kitchenette",
    groups: [
      { title:"Reset Tasks", icon:"🧹", kind:"task",
        items:["Floor Vacuumed","Garbage Bins Emptied (Cabinet next to Mini Fridge & Bathroom)"] },
      { title:"Room & Bathroom Condition", icon:"🛏️", kind:"condition",
        items:["Chairs, TV, Remote, Desk, Bed Frame, Side Table, Lamps, Mini Fridge and Mirror","Bathroom Surfaces (Tub, Shower, Sink, Toilet, Floor, and Mirror)"] },
      { title:"Restock", icon:"🧴", kind:"supply",
        items:[{name:"Teas, Coffee, Sugar, Cups, Sweetener, Spoon/Stir Sticks"},{name:"Facial & Toilet Tissues and Hand Soap"},{name:"Wash Cloths, Hand Towels, Bath Towels",qty:3},{name:"Bath Mat",qty:1}] }
    ]
  },
  stadium_box: {
    label: "Stadium Box",
    meta: "Ping pong, darts, fob",
    groups: [
      { title:"Collect & Return", icon:"🔑", kind:"collect",
        items:[{name:"Access Fob #",withId:true},{name:"Physical Key"},{name:"Ping Pong & Darts Equipment"}] },
      { title:"Room Condition", icon:"🏓", kind:"condition",
        items:["Door / Flooring","Lights / Walls","TV / Remote / Cable Box","Ping Pong Table / Dart Board","Hand Sanitizer Station","Tables / Chairs"] },
      { title:"Security", icon:"🔒", kind:"security",
        items:["Sliding Doors"] },
      { title:"Cleaning Supplies", icon:"🧴", kind:"supply",
        items:[{name:"Paper Towel",qty:1},{name:"Cloth",qty:2},{name:"Multi-Purpose Cleaner",qty:1},{name:"Magic Erasers",qty:2}] }
    ]
  },
  stadium_kitchen: {
    label: "Stadium Kitchen",
    meta: "Appliances, glassware, fob",
    groups: [
      { title:"Collect & Return", icon:"🔑", kind:"collect",
        items:[{name:"Access Fob #",withId:true},{name:"Physical Key"}] },
      { title:"Kitchen Condition", icon:"🍽️", kind:"condition",
        items:["Table / Chairs / Door / Flooring / Lights / Walls","Dishwasher / Fridge / Coffee Maker / Other Appliances","Glassware / Dishes / Cups"] },
      { title:"Restock", icon:"🧴", kind:"supply",
        items:[{name:"Coffee / Tea / Sugar (Replenish as needed)"}] },
      { title:"Security", icon:"🔒", kind:"security",
        items:["Sliding Door","Cupboard / Drawers"] }
    ]
  },
  stadium_lounge: {
    label: "Stadium Lounge",
    meta: "Fireplace, sofas, fob",
    groups: [
      { title:"Collect & Return", icon:"🔑", kind:"collect",
        items:[{name:"Access Fob #",withId:true},{name:"Physical Key"}] },
      { title:"Room Condition", icon:"🛋️", kind:"condition",
        items:["Tables / Chairs","Doors / Flooring","Lights / Walls","Mini Fridge / Closet","Fire Place","Sofas / Pillows"] },
      { title:"Security", icon:"🔒", kind:"security",
        items:["Sliding Door"] },
      { title:"Cleaning Supplies", icon:"🧴", kind:"supply",
        items:[{name:"Paper Towel",qty:2},{name:"Cloth",qty:1},{name:"Multi-Purpose Cleaner",qty:1},{name:"Magic Erasers",qty:2}] }
    ]
  }
};

// =========================================================
// UNIT NUMBER LIST — the building's actual valid units.
// TH1-TH10, then 201-204, then 9-unit floors 3-16, then
// 4-unit floors 17-20. Generated once, not hardcoded, so it
// stays right if a floor's range ever needs adjusting.
// =========================================================
function generateUnitList(){
  const units = [];
  for (let i=1; i<=10; i++) units.push('TH'+i);
  for (let u=201; u<=204; u++) units.push(String(u));
  for (let f=3; f<=16; f++){
    for (let u=1; u<=9; u++) units.push(String(f*100+u));
  }
  for (let f=17; f<=20; f++){
    for (let u=1; u<=4; u++) units.push(String(f*100+u));
  }
  return units;
}
const UNIT_LIST = generateUnitList();

function filterUnitSuggestions(input){
  const val = input.value.trim().toUpperCase();
  const box = document.getElementById('unit-suggestions');
  if (!val){ box.innerHTML=''; box.classList.remove('show'); return; }
  const matches = UNIT_LIST.filter(u => u.startsWith(val)).slice(0, 8);
  if (!matches.length){ box.innerHTML=''; box.classList.remove('show'); return; }
  box.innerHTML = matches.map(u => `<div class="us-item" onmousedown="selectUnit('${u}')">${u}</div>`).join('');
  box.classList.add('show');
}
function selectUnit(u){
  document.getElementById('f-unit').value = u;
  hideUnitSuggestions();
}
function hideUnitSuggestions(){
  const box = document.getElementById('unit-suggestions');
  if (box){ box.classList.remove('show'); box.innerHTML=''; }
}

// =========================================================
// STATE + NAV
// =========================================================
let state = { room:null, mode:null, photos:[] };
const app = document.getElementById('app');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function renderRoomSelect(){
  state = { room:null, mode:null, photos:[] };
  document.querySelector('.sub').textContent = "Select a room to begin";
  let html = '<div class="room-grid">';
  for (const key in ROOMS){
    const r = ROOMS[key];
    html += `<div class="room-card" onclick="selectRoom('${key}')">
      <div class="rc-label">${r.label}</div>
      <div class="rc-meta">${r.meta}</div>
    </div>`;
  }
  html += '</div>';
  app.innerHTML = html;
}

function selectRoom(key){
  state.room = key;
  renderModeSelect();
}

function renderModeSelect(){
  const r = ROOMS[state.room];
  document.querySelector('.sub').textContent = r.label;
  app.innerHTML = `
    <div class="backbar">
      <button class="backbtn" onclick="renderRoomSelect()">&larr; Rooms</button>
      <span class="crumb"><b>${r.label}</b></span>
    </div>
    <div class="choice-row">
      <div class="choice-card" onclick="selectMode('pre')">
        <div><div class="cc-title">Pre-Inspection</div><div class="cc-desc">Before the resident's booking begins</div></div>
        <div class="cc-arrow">&rarr;</div>
      </div>
      <div class="choice-card" onclick="selectMode('post')">
        <div><div class="cc-title">Post-Inspection</div><div class="cc-desc">After the booking ends</div></div>
        <div class="cc-arrow">&rarr;</div>
      </div>
    </div>
  `;
}

function selectMode(mode){
  state.mode = mode;
  renderForm();
}

// =========================================================
// FORM RENDER
// =========================================================
function renderForm(){
  const r = ROOMS[state.room];
  const modeLabel = state.mode === 'pre' ? 'Pre-Inspection' : 'Post-Inspection';
  document.querySelector('.sub').textContent = `${r.label} — ${modeLabel}`;

  let html = `
    <div class="backbar">
      <button class="backbtn" onclick="renderModeSelect()">&larr; Back</button>
      <span class="crumb"><b>${r.label}</b> · ${modeLabel}</span>
    </div>

    <div class="progress-wrap">
      <div class="progress-label"><span>Progress</span><span class="count" id="progress-count">0 / 0</span></div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="field-grid">
      <div class="field"><label>Date</label><input type="date" id="f-date"></div>
      <div class="field" style="position:relative;">
        <label>Unit #</label>
        <input type="text" id="f-unit" placeholder="e.g. 1502 or TH3" autocomplete="off"
          oninput="filterUnitSuggestions(this)" onfocus="filterUnitSuggestions(this)"
          onblur="setTimeout(hideUnitSuggestions, 150)">
        <div class="unit-suggestions" id="unit-suggestions"></div>
      </div>
      <div class="field"><label>Concierge Name</label><input type="text" id="f-concierge" placeholder="Your name"></div>
      <div class="field"><label>Time</label><input type="time" id="f-time"></div>
    </div>
  `;

  r.groups.forEach((grp, gi) => {
    html += `<div class="group">
      <div class="group-head">
        <span class="group-icon">${grp.icon}</span>
        <span class="group-title">${grp.title}</span>
        <span class="group-count">${grp.items.length} item${grp.items.length>1?'s':''}</span>
      </div>`;

    grp.items.forEach((raw, ii) => {
      const item = typeof raw === 'string' ? { name: raw } : raw;
      const id = `g${gi}-i${ii}`;

      if (grp.kind === 'task'){
        html += `<div class="item" data-grp="${gi}" data-item="${ii}" data-kind="task">
          <div class="item-top">
            <div class="item-name">${item.name}</div>
            <div class="item-controls">
              <button type="button" class="pill ok" data-role="done" onclick="togglePill(this)">Done</button>
            </div>
          </div>
        </div>`;
      } else if (grp.kind === 'security'){
        html += `<div class="item" data-grp="${gi}" data-item="${ii}" data-kind="security">
          <div class="item-top">
            <div class="item-name">${item.name}</div>
            <div class="item-controls">
              <button type="button" class="pill select" data-role="unlocked" onclick="selectLockState(this)">Unlocked</button>
              <button type="button" class="pill select" data-role="locked" onclick="selectLockState(this)">Locked</button>
            </div>
          </div>
        </div>`;
      } else if (grp.kind === 'condition'){
        const okLabel = item.okLabel || grp.okLabel || 'Clean';
        const isPre = state.mode === 'pre';
        html += `<div class="item" data-grp="${gi}" data-item="${ii}" data-kind="condition">
          <div class="item-top">
            <div class="item-name">${item.name}</div>
            <div class="item-controls">
              ${isPre
                ? `<button type="button" class="pill ok" data-role="ok" onclick="togglePill(this)">${okLabel}</button>`
                : `<button type="button" class="pill issue" data-role="issue" onclick="selectDamageState(this)">Damage</button>
                   <button type="button" class="pill ok" data-role="nodamage" onclick="selectDamageState(this)">No Damage</button>`}
            </div>
          </div>
          ${isPre ? '' : `<div class="issue-note" id="note-${id}">
            <input type="text" placeholder="Briefly note the issue..." data-role="note">
          </div>`}
        </div>`;
      } else if (grp.kind === 'supply'){
        const maxQty = (item.qty || 0) + 1;
        let qtyPills = '';
        for (let q = 0; q <= maxQty; q++){
          qtyPills += `<button type="button" class="pill select" data-role="qty" data-qty="${q}" onclick="selectQty(this)">${q}</button>`;
        }
        html += `<div class="item" data-grp="${gi}" data-item="${ii}" data-kind="supply">
          <div class="item-top">
            <div class="item-name">${item.name}</div>
            ${item.qty ? `<span class="qty-badge">Ref: ${item.qty}</span>` : ''}
          </div>
          <div class="item-controls" style="margin-top:9px;flex-wrap:wrap;">${qtyPills}</div>
        </div>`;
      } else if (grp.kind === 'collect'){
        const isPre = state.mode === 'pre';
        let controls = '';
        if (isPre){
          if (item.withId){
            const count = item.fobCount || 5;
            let opts = '<option value="">Fob #</option>';
            for (let n=1; n<=count; n++) opts += `<option value="${n}">Fob ${n}</option>`;
            controls += `<select class="id-input" data-role="idnum">${opts}</select>`;
          }
          controls += `<button type="button" class="pill ok" data-role="provided" onclick="togglePill(this)">Provided</button>`;
        } else {
          controls += `<button type="button" class="pill ok" data-role="returned" onclick="togglePill(this)">Returned</button>`;
        }
        html += `<div class="item" data-grp="${gi}" data-item="${ii}" data-kind="collect">
          <div class="item-top">
            <div class="item-name">${item.name}</div>
            <div class="item-controls">${controls}</div>
          </div>
        </div>`;
      }
    });

    html += `</div>`;
  });

  html += `
    <div class="flagged-panel" id="flagged-panel">
      <div class="flagged-title">⚠ Flagged Issues</div>
      <ul class="flagged-list" id="flagged-list"></ul>
    </div>

    <div class="field" style="margin-bottom:16px;">
      <label>Comments</label>
      <textarea rows="3" id="f-comments" placeholder="Any general notes about this inspection..."></textarea>
    </div>

    <div class="photo-section">
      <div class="ph-icon">📷</div>
      <div class="ph-text" id="photo-status">Attach photos for this inspection<br>(one section covers the whole room)</div>
      <input type="file" id="photo-input" accept="image/*" multiple style="display:none" onchange="handlePhotoSelect(event)">
      <button class="photo-upload-btn" type="button" onclick="document.getElementById('photo-input').click()">Add Photos</button>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitInspection()">Submit ${modeLabel}</button>
  `;

  app.innerHTML = html;
  setDefaultDateTime();
  updateProgress();
}

function setDefaultDateTime(){
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const dd = String(now.getDate()).padStart(2,'0');
  const hh = String(now.getHours()).padStart(2,'0');
  const mi = String(now.getMinutes()).padStart(2,'0');
  const dateEl = document.getElementById('f-date');
  const timeEl = document.getElementById('f-time');
  if (dateEl) dateEl.value = `${yyyy}-${mm}-${dd}`;
  if (timeEl) timeEl.value = `${hh}:${mi}`;
}

// =========================================================
// INTERACTIONS
// =========================================================
function togglePill(btn){
  btn.classList.toggle('active');
  updateProgress();
  updateFlaggedSummary();
}

function toggleIssuePill(btn){
  btn.classList.toggle('active');
  const item = btn.closest('.item');
  const note = item.querySelector('.issue-note');
  if (btn.classList.contains('active')){
    note.classList.add('show');
  } else {
    note.classList.remove('show');
    note.querySelector('input').value = '';
  }
  updateProgress();
  updateFlaggedSummary();
}

function selectLockState(btn){
  const controls = btn.parentElement;
  controls.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  updateProgress();
  updateFlaggedSummary();
}

function selectQty(btn){
  const controls = btn.parentElement;
  controls.querySelectorAll('[data-role="qty"]').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  updateProgress();
}

function selectDamageState(btn){
  const controls = btn.parentElement;
  controls.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  const item = btn.closest('.item');
  const note = item.querySelector('.issue-note');
  const isDamage = btn.dataset.role === 'issue';
  if (note){
    if (isDamage) note.classList.add('show');
    else { note.classList.remove('show'); note.querySelector('input').value = ''; }
  }
  updateProgress();
  updateFlaggedSummary();
}

function updateProgress(){
  const items = document.querySelectorAll('.item');
  let total = items.length, done = 0;
  items.forEach(el => {
    const active = el.querySelectorAll('.pill.active');
    if (active.length > 0) done++;
  });
  const pct = total ? Math.round((done/total)*100) : 0;
  const fill = document.getElementById('progress-fill');
  const count = document.getElementById('progress-count');
  if (fill) fill.style.width = pct + '%';
  if (count) count.textContent = `${done} / ${total}`;
}

function updateFlaggedSummary(){
  const panel = document.getElementById('flagged-panel');
  const list = document.getElementById('flagged-list');
  const issues = document.querySelectorAll('.pill.issue.active');
  if (!issues.length){
    panel.classList.remove('show');
    list.innerHTML = '';
    return;
  }
  panel.classList.add('show');
  list.innerHTML = Array.from(issues).map(btn => {
    const item = btn.closest('.item');
    const name = item.querySelector('.item-name').textContent;
    const noteEl = item.querySelector('.issue-note input');
    const note = noteEl ? noteEl.value.trim() : '';
    const label = btn.textContent.trim();
    return `<li>${name} <span class="fl-note">(${label}${note ? ': '+note : ''})</span></li>`;
  }).join('');
}

// re-check flagged summary when a note is typed (live)
document.addEventListener('input', (e) => {
  if (e.target.matches('.issue-note input')) updateFlaggedSummary();
});

function handlePhotoSelect(e){
  state.photos = Array.from(e.target.files);
  const status = document.getElementById('photo-status');
  status.innerHTML = state.photos.length
    ? `${state.photos.length} photo(s) selected`
    : `Attach photos for this inspection<br>(one section covers the whole room)`;
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// =========================================================
// COLLECT + SUBMIT
// =========================================================
function collectChecklist(){
  const r = ROOMS[state.room];
  return r.groups.map((grp, gi) => {
    const items = grp.items.map((raw, ii) => {
      const item = typeof raw === 'string' ? { name: raw } : raw;
      const el = document.querySelector(`[data-grp="${gi}"][data-item="${ii}"]`);
      const rec = { name: item.name };

      if (grp.kind === 'task'){
        rec.done = el.querySelector('[data-role="done"]').classList.contains('active');
      } else if (grp.kind === 'security'){
        const lockedEl = el.querySelector('[data-role="locked"]');
        const unlockedEl = el.querySelector('[data-role="unlocked"]');
        rec.locked = lockedEl ? lockedEl.classList.contains('active') : false;
        rec.unlocked = unlockedEl ? unlockedEl.classList.contains('active') : false;
      } else if (grp.kind === 'condition'){
        const okEl = el.querySelector('[data-role="ok"]');
        const issueEl = el.querySelector('[data-role="issue"]');
        const noDamageEl = el.querySelector('[data-role="nodamage"]');
        const noteEl = el.querySelector('[data-role="note"]');
        if (state.mode === 'pre') rec.okLabel = item.okLabel || grp.okLabel || 'Clean';
        rec.ok = okEl ? okEl.classList.contains('active') : false;
        rec.issue = issueEl ? issueEl.classList.contains('active') : false;
        rec.noDamage = noDamageEl ? noDamageEl.classList.contains('active') : false;
        rec.note = noteEl ? noteEl.value.trim() : '';
      } else if (grp.kind === 'supply'){
        if (item.qty) rec.refQty = item.qty;
        const selectedQtyEl = el.querySelector('[data-role="qty"].active');
        rec.restockedQty = selectedQtyEl ? parseInt(selectedQtyEl.dataset.qty, 10) : null;
      } else if (grp.kind === 'collect'){
        if (state.mode === 'pre'){
          if (item.withId) rec.fobNumber = el.querySelector('[data-role="idnum"]').value;
          rec.provided = el.querySelector('[data-role="provided"]').classList.contains('active');
        } else {
          rec.returned = el.querySelector('[data-role="returned"]').classList.contains('active');
        }
      }
      return rec;
    });
    return { title: grp.title, kind: grp.kind, items };
  });
}

async function submitInspection(){
  const r = ROOMS[state.room];
  const date = document.getElementById('f-date').value;
  const unit = document.getElementById('f-unit').value;
  const concierge = document.getElementById('f-concierge').value;
  const time = document.getElementById('f-time').value;
  const comments = document.getElementById('f-comments').value;

  if (!date || !unit || !concierge){
    toast('Please fill in date, unit, and concierge name');
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  try {
    const photos = await Promise.all(state.photos.map(async f => ({
      filename: f.name,
      mimeType: f.type || 'image/jpeg',
      base64: await fileToBase64(f)
    })));

    const payload = {
      room: state.room,
      roomLabel: r.label,
      mode: state.mode,
      date, unit, concierge, time, comments,
      checklist: collectChecklist(),
      photos
    };

    const res = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();

    if (result.success){
      toast('Submitted — saved to the sheet');
      setTimeout(() => renderRoomSelect(), 1200);
    } else {
      toast('Error: ' + (result.error || 'submission failed'));
      btn.disabled = false;
      btn.textContent = 'Submit ' + (state.mode === 'pre' ? 'Pre-Inspection' : 'Post-Inspection');
    }
  } catch (err) {
    toast('Network error — check the deployment URL');
    btn.disabled = false;
    btn.textContent = 'Submit ' + (state.mode === 'pre' ? 'Pre-Inspection' : 'Post-Inspection');
  }
}

renderRoomSelect();

// =========================================================
// INTRO: single logo floats up and docks, THEN the page reveals
// =========================================================
function startGate(){
  const logo = document.getElementById('siteLogo');
  const backdrop = document.getElementById('gateBackdrop');
  const page = document.getElementById('pageWrap');

  setTimeout(function(){ logo.classList.add('visible'); }, 150);     // fade/unblur in place, still large & centered - clearly visible
  setTimeout(function(){ logo.classList.add('docked'); }, 1400);     // floats up + shrinks to its resting spot
  setTimeout(function(){                                             // fires the instant dock motion (1.2s) finishes - zero extra wait
    backdrop.style.opacity = '0';
    page.classList.add('show');
    setTimeout(function(){ backdrop.style.display = 'none'; }, 300);
  }, 2600);
}
startGate();
</script>
