<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Rideau — Inspection Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0b1826; --navy:#132a3e; --navy-light:#1c3a53; --navy-card:#17324a;
    --gold:#c9a04a; --gold-bright:#e0bc6b;
    --text:#eae6dc; --text-muted:#8fa1b3;
    --ok:#5c9c7c; --ok-bg:rgba(92,156,124,0.16);
    --warn:#c96a52; --warn-bg:rgba(201,106,82,0.16);
    --pre-color:#c9a04a; --post-color:#5c8ea3;
    --border:rgba(201,160,74,0.22); --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--navy-deep);
    background-image:radial-gradient(circle at 15% 0%, rgba(201,160,74,0.06), transparent 45%),
                      radial-gradient(circle at 90% 10%, rgba(201,160,74,0.04), transparent 40%);
    color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  .hidden{display:none !important;}

  /* ---- SINGLE PERSISTENT LOGO: stays large through the whole login
     screen, only docks to its small header spot on a correct password. ---- */
  #siteLogo{position:fixed;z-index:150;top:22%;left:50%;
    transform:translate(-50%,-50%);width:min(46vw,170px);
    opacity:0;filter:blur(10px);
    transition:top 1.2s cubic-bezier(0.16,1,0.3,1), transform 1.2s cubic-bezier(0.16,1,0.3,1),
      width 1.2s cubic-bezier(0.16,1,0.3,1), opacity .9s ease, filter .9s ease;}
  #siteLogo.visible{opacity:1;filter:drop-shadow(0 0 30px rgba(201,160,74,0.4)) drop-shadow(0 0 60px rgba(201,160,74,0.15));}
  #siteLogo.docked{top:22px;transform:translate(-50%,0);width:150px;
    filter:drop-shadow(0 4px 14px rgba(201,160,74,0.3));}

  #gateBackdrop{position:fixed;inset:0;z-index:120;background:var(--navy-deep);
    background-image:radial-gradient(circle at 50% 30%, rgba(201,160,74,0.10), transparent 55%);
    transition:opacity .4s ease;}
  .gate-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 30%,rgba(0,0,0,0.5) 100%);}

  #login-screen{position:fixed;inset:0;z-index:130;}
  .gate-content{position:fixed;left:50%;
    transform:translateX(-50%) translateY(10px);
    text-align:center;padding:20px;width:100%;max-width:380px;box-sizing:border-box;
    opacity:0;transition:opacity .4s ease, transform .4s ease;}
  .gate-content.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .gate-tagline{font-family:'Fraunces',serif;font-weight:600;font-size:19px;color:var(--text);line-height:1.4;
    letter-spacing:0.3px;}
  .gate-hint{font-size:11px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;
    margin-top:8px;margin-bottom:24px;}
  .gate-form{}
  .gate-input{width:100%;background:var(--navy);border:1px solid var(--border);color:var(--text);
    padding:13px 18px;border-radius:10px;font-size:16px;text-align:center;letter-spacing:0.3em;
    outline:none;font-family:'Inter',sans-serif;transition:border-color .2s,box-shadow .2s;box-sizing:border-box;}
  .gate-input:focus{border-color:var(--gold);box-shadow:0 0 20px rgba(201,160,74,0.25);}
  .gate-input.error{border-color:var(--warn);box-shadow:0 0 20px rgba(201,106,82,0.25);animation:gateShake .4s ease;}
  .gate-btn{width:100%;margin-top:12px;background:linear-gradient(135deg,var(--gold),#a67f34);color:var(--navy-deep);
    border:none;padding:13px;border-radius:10px;font-weight:700;font-size:14px;letter-spacing:0.05em;
    cursor:pointer;font-family:'Inter',sans-serif;transition:filter .2s,transform .1s;}
  .gate-btn:hover{filter:brightness(1.08);}
  .gate-btn:active{transform:scale(0.98);}
  .gate-error{color:var(--warn);font-size:12px;margin-top:10px;min-height:16px;}
  .gate-watermark{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:10px;
    color:var(--text-muted);letter-spacing:1.5px;text-transform:uppercase;opacity:0.6;}
  .gate-watermark span{color:var(--gold-bright);}
  @keyframes gateShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}

  /* ---- MAIN APP ---- */
  #main-app{max-width:1100px;margin:0 auto;padding:232px 16px 70px;}
  header.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;
    border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:20px;}
  .eyebrow{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:4px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:24px;margin:0;}
  .clock{text-align:right;color:var(--text-muted);font-size:12px;}
  .clock .time{font-family:'Fraunces',serif;color:var(--gold-bright);font-size:16px;}

  /* filter tabs */
  .tab-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .tab{background:var(--navy-light);border:1.5px solid rgba(201,160,74,0.4);color:var(--text);
    padding:8px 18px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .12s;}
  .tab:hover{border-color:var(--gold-bright);background:var(--navy-card);}
  .tab.active{background:var(--gold);border-color:var(--gold);color:var(--navy-deep);font-weight:700;
    box-shadow:0 0 0 3px rgba(201,160,74,0.25);}

  .master-banner{display:inline-block;margin-top:8px;background:var(--warn);color:#1a0a05;font-size:11px;
    font-weight:800;letter-spacing:.06em;padding:5px 14px;border-radius:12px;text-transform:uppercase;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-card);
    border:1px solid var(--gold);color:var(--gold-bright);padding:12px 22px;border-radius:8px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;max-width:90vw;text-align:center;z-index:200;}
  .toast.show{opacity:1;bottom:32px;}

  .filter-panel{background:var(--navy-card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .filter-panel select, .filter-panel input{background:var(--navy);border:1px solid var(--border);color:var(--text);
    padding:8px 12px;border-radius:7px;font-size:13px;font-family:'Inter',sans-serif;}
  .filter-panel select:focus, .filter-panel input:focus{outline:none;border-color:var(--gold);}
  .clear-btn{background:none;border:1px solid var(--border);color:var(--text-muted);padding:8px 14px;
    border-radius:7px;font-size:12px;cursor:pointer;}
  .clear-btn:hover{border-color:var(--warn);color:var(--warn);}

  .result-meta{color:var(--text-muted);font-size:12px;margin-bottom:14px;}
  .result-meta b{color:var(--gold-bright);}

  /* card grid */
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
  .rcard{background:var(--navy-card);border:1px solid var(--border);border-left:4px solid var(--gold);
    border-radius:var(--radius);padding:15px 16px;cursor:pointer;transition:transform .12s,border-color .12s;}
  .rcard:hover{transform:translateY(-2px);border-color:var(--gold);}
  .rcard.post-mode{border-left-color:var(--post-color);}
  .rcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .rcard-room{font-family:'Fraunces',serif;font-size:15.5px;font-weight:600;}
  .mode-badge{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:10px;font-weight:700;}
  .mode-badge.pre{background:rgba(201,160,74,0.18);color:var(--gold-bright);}
  .mode-badge.post{background:rgba(92,142,163,0.2);color:#8bb8cf;}
  .rcard-meta{font-size:12px;color:var(--text-muted);line-height:1.7;}
  .rcard-meta b{color:var(--text);font-weight:500;}
  .rcard-flags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;}
  .flag-badge{font-size:10.5px;padding:3px 9px;border-radius:10px;font-weight:600;}
  .flag-issue{background:var(--warn-bg);color:var(--warn);}
  .flag-photo{background:rgba(201,160,74,0.12);color:var(--gold-bright);}
  .flag-signed{background:var(--ok-bg);color:var(--ok);}
  .flag-pending{background:var(--navy);color:var(--text-muted);}
  .card-send-btn{width:100%;margin-top:10px;padding:8px;border-radius:7px;border:1px solid var(--gold);
    background:rgba(201,160,74,0.12);color:var(--gold-bright);font-size:11.5px;font-weight:700;
    cursor:pointer;font-family:'Inter',sans-serif;}
  .card-send-btn:hover{background:rgba(201,160,74,0.22);}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
  .empty-state .es-icon{font-size:32px;margin-bottom:10px;}

  /* detail modal */
  #detail-overlay{position:fixed;inset:0;background:rgba(6,13,20,0.75);z-index:90;
    display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;}
  .detail-panel{background:var(--navy-deep);border:1px solid var(--border);border-radius:14px;
    max-width:640px;width:100%;padding:26px 24px 30px;position:relative;}
  .detail-close{position:absolute;top:16px;right:18px;background:none;border:none;color:var(--text-muted);
    font-size:20px;cursor:pointer;}
  .detail-close:hover{color:var(--gold);}
  .detail-head{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border);}
  .detail-head h2{font-family:'Fraunces',serif;font-size:20px;margin:0 0 4px;}
  .detail-head .dh-meta{color:var(--text-muted);font-size:12.5px;}

  .mode-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .mode-toggle button{flex:1;padding:10px;border-radius:8px;border:1.5px solid rgba(201,160,74,0.4);background:var(--navy-light);
    color:var(--text);cursor:pointer;font-size:12.5px;font-weight:600;font-family:'Inter',sans-serif;}
  .mode-toggle button.active{border-color:var(--gold);color:#0b1826;background:var(--gold);font-weight:700;}
  .mode-toggle button:disabled{opacity:0.35;cursor:not-allowed;}

  .action-row{display:flex;gap:8px;margin-bottom:16px;}
  .edit-btn{flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--gold);background:rgba(201,160,74,0.14);
    color:var(--gold-bright);cursor:pointer;font-weight:700;font-size:12.5px;font-family:'Inter',sans-serif;}
  .edit-btn:hover{background:rgba(201,160,74,0.22);}
  .cancel-btn{flex:1;padding:11px;border-radius:8px;border:1.5px solid var(--border);background:var(--navy);
    color:var(--text-muted);cursor:pointer;font-weight:600;font-family:'Inter',sans-serif;}
  .save-btn{flex:2;padding:11px;border-radius:8px;border:none;
    background:linear-gradient(135deg,var(--gold),#a67f34);color:var(--navy-deep);cursor:pointer;
    font-weight:700;font-family:'Inter',sans-serif;}
  .save-btn:disabled{opacity:0.6;cursor:default;}

  /* editable items (edit mode reuses the same look as the form) */
  .item{padding:10px 0;border-bottom:1px solid rgba(201,160,74,0.09);}
  .item:last-child{border-bottom:none;}
  .item-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .item-name{font-size:13px;line-height:1.35;flex:1;min-width:130px;}
  .item-controls{display:flex;gap:8px;align-items:center;flex-shrink:0;}
  .pill{padding:7px 14px;border-radius:20px;border:1.5px solid rgba(201,160,74,0.45);background:var(--navy-light);
    font-size:12px;font-weight:600;color:var(--text);cursor:pointer;transition:all .12s;
    font-family:'Inter',sans-serif;white-space:nowrap;}
  .pill:hover{border-color:var(--gold-bright);background:var(--navy-card);}
  .pill.ok.active{background:var(--ok);border-color:var(--ok);color:#0b1826;font-weight:700;
    box-shadow:0 0 0 3px var(--ok-bg);}
  .pill.issue.active{background:var(--warn);border-color:var(--warn);color:#0b1826;font-weight:700;
    box-shadow:0 0 0 3px var(--warn-bg);}
  .pill.select.active{background:var(--gold);border-color:var(--gold);color:#0b1826;font-weight:700;
    box-shadow:0 0 0 3px rgba(201,160,74,0.25);}
  .qty-badge{background:var(--navy);border:1px solid var(--border);border-radius:5px;padding:3px 8px;
    font-size:10.5px;color:var(--text-muted);}
  .id-input{width:80px;background:var(--navy);border:1px solid var(--border);color:var(--text);
    padding:6px 8px;border-radius:6px;font-size:11.5px;}
  .issue-note{margin-top:8px;display:none;}
  .issue-note.show{display:block;}
  .issue-note input{width:100%;background:var(--navy-deep);border:1px solid var(--warn);color:var(--text);
    padding:8px 10px;border-radius:6px;font-size:12px;}

  .edit-history{max-height:220px;overflow-y:auto;}
  .sig-status-card{border-radius:9px;padding:14px 16px;margin-bottom:16px;}
  .sig-status-card.sig-signed{background:var(--ok-bg);border:1px solid var(--ok);}
  .sig-status-card.sig-pending{background:var(--navy-card);border:1px solid var(--border);}
  .sig-status-title{font-family:'Fraunces',serif;font-size:14px;font-weight:600;}
  .sig-signed .sig-status-title{color:var(--ok);}
  .sig-status-meta{color:var(--text-muted);font-size:12px;margin-top:4px;}
  .sig-image-preview{max-width:160px;margin-top:10px;display:block;}
  .sig-typed-preview{font-family:'Dancing Script',cursive;font-size:26px;color:var(--gold-bright);margin-top:8px;}
  .eh-entry{background:var(--navy-card);border:1px solid var(--border);border-radius:7px;padding:9px 12px;margin-bottom:6px;font-size:12px;}
  .eh-time{color:var(--gold-bright);font-weight:600;margin-bottom:3px;}
  .eh-summary{color:var(--text-muted);word-break:break-word;}

  .dgroup{margin-bottom:14px;}
  .dgroup-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold-bright);margin-bottom:7px;font-weight:600;}
  .ditem{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(201,160,74,0.08);font-size:13px;gap:10px;}
  .ditem:last-child{border-bottom:none;}
  .ditem-name{flex:1;}
  .ditem-status{font-size:11px;padding:3px 9px;border-radius:10px;font-weight:600;white-space:nowrap;}
  .status-ok{background:var(--ok-bg);color:var(--ok);}
  .status-issue{background:var(--warn-bg);color:var(--warn);}
  .status-neutral{background:var(--navy);color:var(--text-muted);}
  .status-select{background:rgba(201,160,74,0.16);color:var(--gold-bright);}
  .ditem-note{font-size:11.5px;color:var(--warn);font-style:italic;margin-top:2px;width:100%;}

  .dcomments{background:var(--navy-card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;
    font-size:13px;color:var(--text);margin-top:8px;}
  .dphotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:8px;}
  .dphotos a img{width:100%;height:70px;object-fit:cover;border-radius:6px;border:1px solid var(--border);}

  .refresh-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;
    animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

  .watermark{text-align:center;color:var(--text-muted);font-size:10px;margin-top:30px;letter-spacing:.05em;
    text-transform:uppercase;opacity:0.6;}
</style>
</head>
<body>

<img id="siteLogo" src="logo.png" alt="The Rideau">
<div id="gateBackdrop"><div class="gate-vignette"></div></div>

<div id="login-screen">
  <div class="gate-content" id="gateContent">
    <div class="gate-tagline" id="gateTagline">Inspection Reports</div>
    <div class="gate-hint" id="gateHint">ENTER PASSWORD TO CONTINUE</div>
    <div class="gate-form" id="gateForm">
      <input class="gate-input" type="password" id="pw-input" placeholder="••••••••" maxlength="20" autocomplete="off" onkeydown="if(event.key==='Enter')tryLogin()">
      <button class="gate-btn" onclick="tryLogin()">ENTER</button>
      <div class="gate-error" id="login-error"></div>
    </div>
  </div>
  <div class="gate-watermark">Designed by <span>Shrutik</span></div>
</div>

<div id="main-app" class="hidden">
  <header class="top">
    <div>
      <div class="eyebrow">The Rideau &nbsp;·&nbsp; 1035 Bank Street</div>
      <h1>Inspection Reports</h1>
      <div id="master-banner" class="master-banner hidden">🔑 MASTER REPORT</div>
      <div style="margin-top:10px;"><a href="index.html" style="color:var(--gold);font-size:11.5px;text-decoration:none;border:1px solid var(--border);padding:5px 14px;border-radius:14px;">&larr; New Inspection</a></div>
    </div>
    <div class="clock">
      <div><span class="refresh-dot"></span>Live</div>
      <div class="time" id="clock-time">--:--</div>
      <div id="clock-date"></div>
    </div>
  </header>

  <div class="tab-row" id="tab-row"></div>
  <div class="filter-panel" id="filter-panel"></div>
  <div class="result-meta" id="result-meta"></div>
  <div class="card-grid" id="card-grid"></div>

  <div class="watermark">Designed by Shrutik</div>
</div>
<div class="toast" id="toast"></div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz-69e-XALVtmU1bJ2WpPpUbs39KVniUmsxNzDkxlH8LxErxg7qEWlytviprtTAJvL6xQ/exec";
const PASSWORD_REGULAR = "12345";
const PASSWORD_MASTER = "S12345";
let isMaster = false;
const ROOM_LABELS = {
  canal_lounge: "Canal Lounge & Patio",
  guest_suite: "Guest Suite",
  stadium_box: "Stadium Box",
  stadium_kitchen: "Stadium Kitchen",
  stadium_lounge: "Stadium Lounge"
};

// =========================================================
// LOGIN GATE: logo appears large and STAYS large - the password
// card fades in below it. The logo only shrinks and docks into
// its header spot at the moment the password is correct.
// =========================================================
function startGate(){
  const logo = document.getElementById('siteLogo');
  const content = document.getElementById('gateContent');

  positionContentBelowLogo();
  window.addEventListener('resize', positionContentBelowLogo);

  setTimeout(function(){ logo.classList.add('visible'); }, 150);   // fade/unblur in place, stays large
  setTimeout(function(){
    content.classList.add('show');
    document.getElementById('pw-input').focus();
  }, 1000);
}
function positionContentBelowLogo(){
  const logo = document.getElementById('siteLogo');
  const content = document.getElementById('gateContent');
  const rect = logo.getBoundingClientRect();
  content.style.top = (rect.bottom + 22) + 'px';
}
startGate();

function tryLogin(){
  const val = document.getElementById('pw-input').value;
  if (val === PASSWORD_MASTER || val === PASSWORD_REGULAR){
    isMaster = (val === PASSWORD_MASTER);
    const backdrop = document.getElementById('gateBackdrop');
    const gate = document.getElementById('login-screen');
    const logo = document.getElementById('siteLogo');

    logo.classList.add('docked');           // shrink + float up into the header spot, right now
    backdrop.style.opacity = '0';
    gate.style.transition = 'opacity 0.35s ease';
    gate.style.opacity = '0';

    document.getElementById('main-app').classList.remove('hidden');
    document.getElementById('master-banner').classList.toggle('hidden', !isMaster);
    initDashboard();

    setTimeout(() => {
      backdrop.style.display = 'none';
      gate.style.display = 'none';
      // Unpin from the viewport (no scroll has happened yet, login screen
      // doesn't scroll) so it scrolls away naturally with the dashboard header.
      logo.style.position = 'absolute';
      logo.style.top = '22px';
    }, 1250);                               // matches the 1.2s dock transition duration
  } else {
    const input = document.getElementById('pw-input');
    input.classList.add('error');
    document.getElementById('login-error').textContent = 'Incorrect password';
    setTimeout(() => { input.classList.remove('error'); input.value = ''; }, 900);
  }
}

// =========================================================
// TOAST
// =========================================================
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// =========================================================
// CLOCK
// =========================================================
function tickClock(){
  const now = new Date();
  document.getElementById('clock-time').textContent = now.toLocaleTimeString('en-CA', {hour:'2-digit',minute:'2-digit'});
  document.getElementById('clock-date').textContent = now.toLocaleDateString('en-CA', {weekday:'short', month:'short', day:'numeric'});
}
setInterval(tickClock, 1000);
tickClock();

// =========================================================
// STATE
// =========================================================
let allData = [];
let activeTab = 'all';       // all | room | month | date | unit
let filters = { room:'', month:'', date:'', unit:'' };

async function initDashboard(){
  buildTabs();
  buildFilterPanel();
  await fetchData();
  setInterval(fetchData, 45000); // silent background refresh
}

async function fetchData(){
  try {
    const res = await fetch(WEB_APP_URL);
    const json = await res.json();
    if (json.success){
      allData = json.data;
      renderCards();
    }
  } catch(err){
    // silent fail on background refresh - don't disrupt the view
    console.warn('Refresh failed', err);
  }
}

// =========================================================
// TABS + FILTER PANEL
// =========================================================
function buildTabs(){
  const tabs = [
    {key:'all', label:'All'},
    {key:'room', label:'By Room'},
    {key:'month', label:'By Month'},
    {key:'date', label:'By Date'},
    {key:'unit', label:'By Unit'}
  ];
  document.getElementById('tab-row').innerHTML = tabs.map(t =>
    `<button class="tab ${t.key===activeTab?'active':''}" onclick="setTab('${t.key}')">${t.label}</button>`
  ).join('');
}

function setTab(key){
  activeTab = key;
  filters = { room:'', month:'', date:'', unit:'' };
  buildTabs();
  buildFilterPanel();
  renderCards();
}

function buildFilterPanel(){
  const panel = document.getElementById('filter-panel');
  if (activeTab === 'all'){
    panel.innerHTML = `<span style="color:var(--text-muted);font-size:12.5px;">Showing every report, most recent first.</span>`;
    return;
  }
  if (activeTab === 'room'){
    let opts = '<option value="">Select a room...</option>';
    for (const k in ROOM_LABELS) opts += `<option value="${k}">${ROOM_LABELS[k]}</option>`;
    panel.innerHTML = `<select onchange="filters.room=this.value; renderCards();">${opts}</select>`;
  } else if (activeTab === 'month'){
    panel.innerHTML = `<input type="month" onchange="filters.month=this.value; renderCards();">`;
  } else if (activeTab === 'date'){
    panel.innerHTML = `<input type="date" onchange="filters.date=this.value; renderCards();">`;
  } else if (activeTab === 'unit'){
    panel.innerHTML = `<input type="text" placeholder="Unit # e.g. 1502" oninput="filters.unit=this.value; renderCards();">`;
  }
}

// =========================================================
// FILTER + RENDER CARDS
// =========================================================
function applyFilters(){
  return allData.filter(r => {
    if (filters.room && r.Room !== filters.room) return false;
    if (filters.month && r.Date && !String(r.Date).startsWith(filters.month)) return false;
    if (filters.date && r.Date && String(r.Date).slice(0,10) !== filters.date) return false;
    if (filters.unit && !String(r.Unit || '').toLowerCase().includes(filters.unit.toLowerCase())) return false;
    return true;
  });
}

function countIssues(checklist){
  if (!Array.isArray(checklist)) return 0;
  let n = 0;
  checklist.forEach(grp => (grp.items||[]).forEach(it => { if (it.issue) n++; }));
  return n;
}

// =========================================================
// SEND FOR SIGNATURE
// =========================================================
function buildSignLink(submissionId){
  const base = window.location.href.replace(/[^/]*$/, '');
  return base + 'sign.html?id=' + encodeURIComponent(submissionId);
}

function sendForSignature(submissionId, roomLabel, modeLabel, unit, date){
  const link = buildSignLink(submissionId);
  const subject = `Signature Required - ${roomLabel} - ${date}`;
  const body = `Hello,\n\nPlease review and sign the amenity inspection report below:\n\n`
    + `Room: ${roomLabel}\nUnit: ${unit}\nType: ${modeLabel}\n\n`
    + `Sign here: ${link}\n\n`
    + `This confirms the condition of the room for your booking. If you have any questions, please contact the concierge.\n\n`
    + `Thank you,\nThe Rideau Concierge`;
  window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function renderCards(){
  const data = applyFilters();
  const grid = document.getElementById('card-grid');
  const meta = document.getElementById('result-meta');
  meta.innerHTML = `<b>${data.length}</b> report${data.length===1?'':'s'} found`;

  if (!data.length){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <div class="es-icon">📋</div>No reports match these filters yet.
    </div>`;
    return;
  }

  grid.innerHTML = data.map((r, idx) => {
    const issues = countIssues(r.ChecklistJSON);
    const photoCount = (r.PhotoURLs||[]).length;
    const isSigned = r.SignatureStatus === 'Signed';
    const modeLabel = r.Mode === 'pre' ? 'Pre-Inspection' : 'Post-Inspection';
    const roomLabel = (ROOM_LABELS[r.Room] || r.Room).replace(/'/g, "\\'");
    return `<div class="rcard ${r.Mode==='post'?'post-mode':''}" onclick="openDetailById('${r.SubmissionID}')">
      <div class="rcard-top">
        <div class="rcard-room">${ROOM_LABELS[r.Room] || r.Room}</div>
        <span class="mode-badge ${r.Mode}">${r.Mode}</span>
      </div>
      <div class="rcard-meta">
        <b>Unit</b> ${r.Unit || '—'}<br>
        <b>Date</b> ${r.Date || '—'} ${r.Time || ''}<br>
        <b>Concierge</b> ${r.Concierge || '—'}
      </div>
      <div class="rcard-flags">
        ${issues > 0 ? `<span class="flag-badge flag-issue">⚠ ${issues} issue${issues>1?'s':''}</span>` : ''}
        ${photoCount > 0 ? `<span class="flag-badge flag-photo">📷 ${photoCount}</span>` : ''}
        <span class="flag-badge ${isSigned?'flag-signed':'flag-pending'}">${isSigned?'✓ Signed':'Unsigned'}</span>
      </div>
      ${!isSigned ? `<button class="card-send-btn" onclick="event.stopPropagation(); sendForSignature('${r.SubmissionID}','${roomLabel}','${modeLabel}','${r.Unit||''}','${r.Date||''}')">✍ Send for Signature</button>` : ''}
    </div>`;
  }).join('');
}

// =========================================================
// DETAIL VIEW (with Pre/Post pairing) + EDIT MODE
// =========================================================
let detailPair = { pre:null, post:null };
let detailMode = 'pre';
let editMode = false;
let editSourceRecord = null; // deep snapshot of the record when Edit was clicked, for diffing

function openDetailById(submissionId){
  const record = allData.find(r => r.SubmissionID === submissionId);
  if (!record){
    toast('Could not find that report - refreshing...');
    fetchData();
    return;
  }
  openDetail(record);
}

function openDetail(record){
  const pair = allData.filter(r => r.RecordKey === record.RecordKey);
  detailPair.pre = pair.find(r => r.Mode === 'pre') || null;
  detailPair.post = pair.find(r => r.Mode === 'post') || null;
  detailMode = record.Mode;
  editMode = false;
  editSourceRecord = null;

  const overlay = document.createElement('div');
  overlay.id = 'detail-overlay';
  overlay.onclick = (e) => { if (e.target.id === 'detail-overlay') closeDetail(); };
  document.body.appendChild(overlay);
  renderDetail();
}

function closeDetail(){
  const el = document.getElementById('detail-overlay');
  if (el) el.remove();
  editMode = false;
  editSourceRecord = null;
}

function switchDetailMode(mode){
  detailMode = mode;
  editMode = false;
  renderDetail();
}

function renderDetail(){
  const overlay = document.getElementById('detail-overlay');
  const record = detailPair[detailMode] || detailPair.pre || detailPair.post;
  if (!record){ closeDetail(); return; }
  if (editMode) renderDetailEdit(overlay, record);
  else renderDetailView(overlay, record);
}

function renderDetailView(overlay, record){
  const checklist = Array.isArray(record.ChecklistJSON) ? record.ChecklistJSON : [];
  const mode = record.Mode;
  let groupsHtml = checklist.map(grp => {
    const itemsHtml = grp.items.map(it => {
      let statusHtml = '';
      if (grp.kind === 'task'){
        statusHtml = `<span class="ditem-status ${it.done?'status-ok':'status-neutral'}">${it.done?'Done':'Not done'}</span>`;
      } else if (grp.kind === 'security'){
        if (it.unlocked) statusHtml = `<span class="ditem-status status-select">Unlocked</span>`;
        else if (it.locked) statusHtml = `<span class="ditem-status status-select">Locked</span>`;
        else statusHtml = `<span class="ditem-status status-neutral">Not set</span>`;
      } else if (grp.kind === 'condition'){
        if (mode === 'pre'){
          const label = it.okLabel || grp.okLabel || 'Clean';
          statusHtml = it.ok
            ? `<span class="ditem-status status-ok">${label}</span>`
            : `<span class="ditem-status status-neutral">Not confirmed</span>`;
        } else {
          if (it.issue) statusHtml = `<span class="ditem-status status-issue">Damage</span>`;
          else if (it.noDamage) statusHtml = `<span class="ditem-status status-ok">No Damage</span>`;
          else statusHtml = `<span class="ditem-status status-neutral">Not reviewed</span>`;
        }
      } else if (grp.kind === 'supply'){
        const qtySet = it.restockedQty !== null && it.restockedQty !== undefined;
        statusHtml = `<span class="ditem-status ${qtySet?'status-select':'status-neutral'}">${qtySet?('Qty: '+it.restockedQty):'Not set'}</span>`;
      } else if (grp.kind === 'collect'){
        if ('provided' in it) statusHtml = `<span class="ditem-status ${it.provided?'status-ok':'status-neutral'}">${it.provided?'Provided':'—'}</span>${it.fobNumber?` <span class="ditem-status status-neutral">#${it.fobNumber}</span>`:''}`;
        else if ('returned' in it) statusHtml = `<span class="ditem-status ${it.returned?'status-ok':'status-neutral'}">${it.returned?'Returned':'—'}</span>`;
      }
      return `<div class="ditem">
        <div class="ditem-name">${it.name}${it.note ? `<div class="ditem-note">${it.note}</div>` : ''}</div>
        ${statusHtml}
      </div>`;
    }).join('');
    return `<div class="dgroup"><div class="dgroup-title">${grp.title}</div>${itemsHtml}</div>`;
  }).join('');

  const photosHtml = (record.PhotoURLs||[]).length
    ? `<div class="dphotos">${record.PhotoURLs.map(u=>`<a href="${u}" target="_blank"><img src="${u}"></a>`).join('')}</div>`
    : '';

  const historyHtml = (isMaster && record.EditHistory && record.EditHistory.length)
    ? `<div class="dgroup-title" style="margin-top:14px;">Edit History <span style="color:var(--text-muted);font-weight:400;text-transform:none;">(master view)</span></div>
       <div class="edit-history">${record.EditHistory.slice().reverse().map(h => `
         <div class="eh-entry">
           <div class="eh-time">${new Date(h.timestamp).toLocaleString('en-CA')}</div>
           <div class="eh-summary">${h.summary}</div>
         </div>`).join('')}</div>`
    : '';

  const modeLabelDetail = record.Mode === 'pre' ? 'Pre-Inspection' : 'Post-Inspection';
  const roomLabelDetail = (ROOM_LABELS[record.Room] || record.Room).replace(/'/g, "\\'");
  const signatureHtml = record.SignatureStatus === 'Signed'
    ? `<div class="sig-status-card sig-signed">
         <div class="sig-status-title">✓ Signed</div>
         <div class="sig-status-meta">${record.SignerName || ''}${record.SignedAt ? ' · ' + new Date(record.SignedAt).toLocaleString('en-CA', {dateStyle:'medium', timeStyle:'short'}) : ''}</div>
         ${record.SignatureType === 'drawn' && record.SignatureImageURL ? `<img class="sig-image-preview" src="${record.SignatureImageURL}">` : ''}
         ${record.SignatureType === 'typed' ? `<div class="sig-typed-preview">${record.SignerName || ''}</div>` : ''}
       </div>`
    : `<div class="sig-status-card sig-pending">
         <div class="sig-status-title">Awaiting Signature</div>
         <button class="edit-btn" style="margin-top:10px;width:100%;" onclick="sendForSignature('${record.SubmissionID}','${roomLabelDetail}','${modeLabelDetail}','${record.Unit||''}','${record.Date||''}')">✍ Send for Signature</button>
       </div>`;

  overlay.innerHTML = `
    <div class="detail-panel">
      <button class="detail-close" onclick="closeDetail()">✕</button>
      <div class="detail-head">
        <h2>${ROOM_LABELS[record.Room] || record.Room}</h2>
        <div class="dh-meta">Unit ${record.Unit} · ${record.Date} ${record.Time} · ${record.Concierge}</div>
      </div>

      <div class="mode-toggle">
        <button class="${detailMode==='pre'?'active':''}" ${!detailPair.pre?'disabled':''} onclick="switchDetailMode('pre')">Pre-Inspection</button>
        <button class="${detailMode==='post'?'active':''}" ${!detailPair.post?'disabled':''} onclick="switchDetailMode('post')">Post-Inspection</button>
      </div>

      <div class="action-row">
        <button class="edit-btn" onclick="enterEditMode()">✎ Edit Report</button>
      </div>

      ${signatureHtml}

      ${groupsHtml}

      ${record.Comments ? `<div class="dgroup-title" style="margin-top:14px;">Comments</div><div class="dcomments">${record.Comments}</div>` : ''}
      ${photosHtml ? `<div class="dgroup-title" style="margin-top:14px;">Photos</div>${photosHtml}` : ''}
      ${historyHtml}
    </div>
  `;
}

// =========================================================
// EDIT MODE
// =========================================================
function enterEditMode(){
  const record = detailPair[detailMode] || detailPair.pre || detailPair.post;
  editSourceRecord = JSON.parse(JSON.stringify(record)); // snapshot for diffing
  editMode = true;
  renderDetail();
}

function exitEditMode(){
  editMode = false;
  editSourceRecord = null;
  renderDetail();
}

function buildEditItemHtml(grp, gi, ii, it, mode){
  const noteVal = (it.note||'').replace(/"/g,'&quot;');
  if (grp.kind === 'task'){
    return `<div class="item" data-egrp="${gi}" data-eitem="${ii}">
      <div class="item-top"><div class="item-name">${it.name}</div>
      <div class="item-controls"><button type="button" class="pill ok ${it.done?'active':''}" data-role="done" onclick="togglePill(this)">Done</button></div></div>
    </div>`;
  }
  if (grp.kind === 'security'){
    return `<div class="item" data-egrp="${gi}" data-eitem="${ii}">
      <div class="item-top"><div class="item-name">${it.name}</div>
      <div class="item-controls">
        <button type="button" class="pill select ${it.unlocked?'active':''}" data-role="unlocked" onclick="selectLockState(this)">Unlocked</button>
        <button type="button" class="pill select ${it.locked?'active':''}" data-role="locked" onclick="selectLockState(this)">Locked</button>
      </div></div>
    </div>`;
  }
  if (grp.kind === 'condition'){
    if (mode === 'pre'){
      const label = it.okLabel || grp.okLabel || 'Clean';
      return `<div class="item" data-egrp="${gi}" data-eitem="${ii}">
        <div class="item-top"><div class="item-name">${it.name}</div>
        <div class="item-controls"><button type="button" class="pill ok ${it.ok?'active':''}" data-role="ok" onclick="togglePill(this)">${label}</button></div></div>
      </div>`;
    }
    return `<div class="item" data-egrp="${gi}" data-eitem="${ii}">
      <div class="item-top"><div class="item-name">${it.name}</div>
      <div class="item-controls">
        <button type="button" class="pill issue ${it.issue?'active':''}" data-role="issue" onclick="selectDamageState(this)">Damage</button>
        <button type="button" class="pill ok ${it.noDamage?'active':''}" data-role="nodamage" onclick="selectDamageState(this)">No Damage</button>
      </div></div>
      <div class="issue-note ${it.issue?'show':''}"><input type="text" data-role="note" value="${noteVal}" placeholder="Briefly note the issue..."></div>
    </div>`;
  }
  if (grp.kind === 'supply'){
    const maxQty = (it.refQty || 0) + 1;
    let qtyPills = '';
    for (let q = 0; q <= maxQty; q++){
      qtyPills += `<button type="button" class="pill select ${it.restockedQty===q?'active':''}" data-role="qty" data-qty="${q}" onclick="selectQty(this)">${q}</button>`;
    }
    return `<div class="item" data-egrp="${gi}" data-eitem="${ii}">
      <div class="item-top"><div class="item-name">${it.name}</div>${it.refQty?`<span class="qty-badge">Ref: ${it.refQty}</span>`:''}</div>
      <div class="item-controls" style="margin-top:9px;flex-wrap:wrap;">${qtyPills}</div>
    </div>`;
  }
  if (grp.kind === 'collect'){
    if (mode === 'pre'){
      let fobHtml = '';
      if ('fobNumber' in it){
        let opts = '<option value="">Fob #</option>';
        for (let n=1; n<=5; n++) opts += `<option value="${n}" ${String(it.fobNumber)===String(n)?'selected':''}>Fob ${n}</option>`;
        fobHtml = `<select class="id-input" data-role="idnum">${opts}</select>`;
      }
      return `<div class="item" data-egrp="${gi}" data-eitem="${ii}">
        <div class="item-top"><div class="item-name">${it.name}</div>
        <div class="item-controls">${fobHtml}<button type="button" class="pill ok ${it.provided?'active':''}" data-role="provided" onclick="togglePill(this)">Provided</button></div></div>
      </div>`;
    }
    return `<div class="item" data-egrp="${gi}" data-eitem="${ii}">
      <div class="item-top"><div class="item-name">${it.name}</div>
      <div class="item-controls"><button type="button" class="pill ok ${it.returned?'active':''}" data-role="returned" onclick="togglePill(this)">Returned</button></div></div>
    </div>`;
  }
  return '';
}

function togglePill(btn){ btn.classList.toggle('active'); }
function toggleEditIssuePill(btn){
  btn.classList.toggle('active');
  const item = btn.closest('.item');
  const note = item.querySelector('.issue-note');
  if (note) note.classList.toggle('show', btn.classList.contains('active'));
}
function selectLockState(btn){
  const controls = btn.parentElement;
  controls.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
}
function selectQty(btn){
  const controls = btn.parentElement;
  controls.querySelectorAll('[data-role="qty"]').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
}
function selectDamageState(btn){
  const controls = btn.parentElement;
  controls.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  const item = btn.closest('.item');
  const note = item.querySelector('.issue-note');
  const isDamage = btn.dataset.role === 'issue';
  if (note){
    if (isDamage) note.classList.add('show');
    else { note.classList.remove('show'); note.querySelector('input').value = ''; }
  }
}

  const mode = record.Mode;
  const groupsHtml = checklist.map((grp, gi) => {
    const itemsHtml = grp.items.map((it, ii) => buildEditItemHtml(grp, gi, ii, it, mode)).join('');
    return `<div class="dgroup"><div class="dgroup-title">${grp.title}</div>${itemsHtml}</div>`;
  }).join('');

  overlay.innerHTML = `
    <div class="detail-panel">
      <button class="detail-close" onclick="closeDetail()">✕</button>
      <div class="detail-head">
        <h2>${ROOM_LABELS[record.Room] || record.Room} <span style="font-size:11px;color:var(--warn);text-transform:uppercase;letter-spacing:.05em;">· Editing</span></h2>
        <div class="dh-meta">Unit ${record.Unit} · ${record.Date} · ${mode==='pre'?'Pre-Inspection':'Post-Inspection'}</div>
      </div>

      <div class="field-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;">
        <div><label style="font-size:11px;color:var(--text-muted);text-transform:uppercase;display:block;margin-bottom:5px;">Concierge</label>
          <input type="text" id="edit-concierge" value="${(record.Concierge||'').replace(/"/g,'&quot;')}"
            style="width:100%;background:var(--navy);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:7px;font-size:13px;box-sizing:border-box;"></div>
        <div><label style="font-size:11px;color:var(--text-muted);text-transform:uppercase;display:block;margin-bottom:5px;">Time</label>
          <input type="time" id="edit-time" value="${record.Time||''}"
            style="width:100%;background:var(--navy);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:7px;font-size:13px;box-sizing:border-box;"></div>
      </div>

      ${groupsHtml}

      <div class="dgroup-title" style="margin-top:14px;">Comments</div>
      <textarea id="edit-comments" rows="3" style="width:100%;background:var(--navy);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:7px;font-size:13px;font-family:'Inter',sans-serif;box-sizing:border-box;">${record.Comments||''}</textarea>

      <div class="action-row" style="margin-top:18px;">
        <button class="cancel-btn" onclick="exitEditMode()">Cancel</button>
        <button class="save-btn" id="save-edit-btn" onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  `;
}

function collectEditedChecklist(record){
  const checklist = Array.isArray(record.ChecklistJSON) ? record.ChecklistJSON : [];
  const mode = record.Mode;
  return checklist.map((grp, gi) => {
    const items = grp.items.map((it, ii) => {
      const el = document.querySelector(`[data-egrp="${gi}"][data-eitem="${ii}"]`);
      const rec = { name: it.name };
      if (grp.kind === 'task'){
        rec.done = el.querySelector('[data-role="done"]').classList.contains('active');
      } else if (grp.kind === 'security'){
        const lockedEl = el.querySelector('[data-role="locked"]');
        const unlockedEl = el.querySelector('[data-role="unlocked"]');
        rec.locked = lockedEl ? lockedEl.classList.contains('active') : false;
        rec.unlocked = unlockedEl ? unlockedEl.classList.contains('active') : false;
      } else if (grp.kind === 'condition'){
        const okEl = el.querySelector('[data-role="ok"]');
        const issueEl = el.querySelector('[data-role="issue"]');
        const noDamageEl = el.querySelector('[data-role="nodamage"]');
        const noteEl = el.querySelector('[data-role="note"]');
        if (it.okLabel) rec.okLabel = it.okLabel;
        rec.ok = okEl ? okEl.classList.contains('active') : false;
        rec.issue = issueEl ? issueEl.classList.contains('active') : false;
        rec.noDamage = noDamageEl ? noDamageEl.classList.contains('active') : false;
        rec.note = noteEl ? noteEl.value.trim() : '';
      } else if (grp.kind === 'supply'){
        if (it.refQty) rec.refQty = it.refQty;
        const selectedQtyEl = el.querySelector('[data-role="qty"].active');
        rec.restockedQty = selectedQtyEl ? parseInt(selectedQtyEl.dataset.qty, 10) : null;
      } else if (grp.kind === 'collect'){
        if (mode === 'pre'){
          if ('fobNumber' in it) rec.fobNumber = el.querySelector('[data-role="idnum"]').value;
          rec.provided = el.querySelector('[data-role="provided"]').classList.contains('active');
        } else {
          rec.returned = el.querySelector('[data-role="returned"]').classList.contains('active');
        }
      }
      return rec;
    });
    return { title: grp.title, kind: grp.kind, items };
  });
}

function buildEditSummary(originalChecklist, updatedChecklist){
  const changes = [];
  const origFlat = [];
  (originalChecklist||[]).forEach(grp => (grp.items||[]).forEach(it => origFlat.push(it)));
  const updFlat = [];
  (updatedChecklist||[]).forEach(grp => (grp.items||[]).forEach(it => updFlat.push(it)));
  const keys = ['ok','issue','noDamage','done','restockedQty','provided','returned','note','fobNumber','locked','unlocked'];
  origFlat.forEach((o, idx) => {
    const u = updFlat[idx];
    if (!u) return;
    keys.forEach(k => {
      const ov = o[k] === undefined ? null : o[k];
      const uv = u[k] === undefined ? null : u[k];
      if (JSON.stringify(ov) !== JSON.stringify(uv)){
        changes.push(`${o.name} (${k}): ${JSON.stringify(ov)} \u2192 ${JSON.stringify(uv)}`);
      }
    });
  });
  return changes;
}

async function saveEdit(){
  const original = editSourceRecord;
  const current = detailPair[detailMode] || detailPair.pre || detailPair.post;
  const newChecklist = collectEditedChecklist(current);
  const newComments = document.getElementById('edit-comments').value;
  const newConcierge = document.getElementById('edit-concierge').value;
  const newTime = document.getElementById('edit-time').value;

  const changes = buildEditSummary(original.ChecklistJSON, newChecklist);
  if (newComments !== (original.Comments||'')) changes.push('Comments updated');
  if (newConcierge !== (original.Concierge||'')) changes.push(`Concierge: "${original.Concierge||''}" \u2192 "${newConcierge}"`);
  if (newTime !== (original.Time||'')) changes.push(`Time: ${original.Time||''} \u2192 ${newTime}`);

  if (!changes.length){
    toast('No changes made');
    exitEditMode();
    return;
  }

  const btn = document.getElementById('save-edit-btn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const res = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'update',
        submissionId: current.SubmissionID,
        concierge: newConcierge,
        time: newTime,
        checklist: newChecklist,
        comments: newComments,
        editSummary: changes.join('; ')
      })
    });
    const result = await res.json();
    if (result.success){
      toast('Changes saved');
      editMode = false;
      editSourceRecord = null;
      await fetchData();
      const pair = allData.filter(r => r.RecordKey === current.RecordKey);
      detailPair.pre = pair.find(r => r.Mode === 'pre') || null;
      detailPair.post = pair.find(r => r.Mode === 'post') || null;
      renderDetail();
    } else {
      toast('Save failed: ' + (result.error || 'unknown error'));
      btn.disabled = false;
      btn.textContent = 'Save Changes';
    }
  } catch (err) {
    toast('Network error while saving');
    btn.disabled = false;
    btn.textContent = 'Save Changes';
  }
}
</script>
</body>
</html>
